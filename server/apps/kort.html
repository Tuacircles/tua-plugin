<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Tua — kort</title>
<style>
  /* Strukturen bruker vertens tokens (lys/mørk følger automatisk); Tua-aksentene er korall og Georgia for titler (V12). */
  :root {
    --bg: var(--color-background-primary, #fff);
    --bg2: var(--color-background-secondary, #F5F4ED);
    --fg: var(--color-text-primary, #141413);
    --fg2: var(--color-text-secondary, #3D3D3A);
    --fg3: var(--color-text-tertiary, #73726C);
    --line: var(--color-border-tertiary, rgba(31,30,29,.15));
    --line2: var(--color-border-primary, rgba(31,30,29,.4));
    --warn-bg: var(--color-background-warning, #F6EEDF);
    --warn-fg: var(--color-text-warning, #5A4815);
    --sans: var(--font-sans, -apple-system, "SF Pro Text", system-ui, sans-serif);
    --serif: Georgia, "Times New Roman", serif;
    --r: var(--border-radius-md, 8px);
    --coral: #C04A38;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.4; }
  #root { padding: 12px 14px 10px; }
  .eyebrow { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--coral); }
  .eyebrow .meta { color: var(--fg3); letter-spacing: 0; text-transform: none; font-size: 12px; }
  h1 { margin: 4px 0 6px; font-family: var(--serif); font-size: 19px; line-height: 1.2; font-weight: 700; color: var(--fg); }
  h2 { margin: 2px 0 4px; font-family: var(--serif); font-size: 16px; line-height: 1.25; font-weight: 700; }
  .s { margin: 0 0 8px; font-size: 14px; line-height: 1.45; color: var(--fg2); }
  .why { margin: 0 0 8px; font-size: 12px; color: var(--fg3); }
  .body { margin: 8px 0; font-family: var(--serif); font-size: 14px; line-height: 1.55; border-top: 1px solid var(--line); padding-top: 4px; }
  .md p { margin: 6px 0; } .md h3 { margin: 10px 0 4px; font-size: 15px; } .md h4 { margin: 8px 0 2px; font-size: 14px; }
  .md ul { margin: 4px 0; padding-left: 20px; } .md li { margin: 2px 0; } .md code { font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; background: var(--bg2); padding: 0 4px; border-radius: 3px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 0; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 999px; overflow: hidden; }
  .seg button { min-height: 32px; min-width: 44px; padding: 0 12px; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 13px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .seg button:disabled { color: var(--fg3); cursor: default; }
  .btn { min-height: 32px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 999px; background: transparent; color: var(--fg); font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn:disabled { color: var(--fg3); border-color: var(--line); cursor: default; }
  .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .btn.primary:disabled { background: transparent; color: var(--fg3); border-color: var(--line); }
  .row.nav { margin: 0 0 10px; }
  .row.bla { margin-top: 14px; align-items: center; }
  .filter { flex: 1 1 200px; min-height: 32px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 999px; background: transparent; color: var(--fg); font: inherit; font-size: 13px; }
  .alle { margin-top: 8px; border-top: 1px solid var(--line); }
  .alle .rad { display: grid; grid-template-columns: 78px 1fr minmax(0, 30%); gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .alle .dato, .alle .pro { color: var(--fg3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alle .pro { text-align: right; }
  .alle .tittel { color: var(--fg); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .alle .tittel:hover { text-decoration: underline; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--bg2); color: var(--fg2); border: 1px solid var(--line); }
  .chip.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .chip.link { cursor: pointer; }
  .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg3); margin: 10px 0 2px; }
  .hit { padding: 10px 0; border-top: 1px solid var(--line); }
  .hit:first-of-type { border-top: 0; padding-top: 4px; }
  .hit h2 a, .hit h2 { color: var(--fg); text-decoration: none; cursor: pointer; }
  .hit .s { margin-bottom: 6px; }
  .hit .inline { margin: 6px 0 0; padding: 8px 10px; background: var(--bg2); border-radius: var(--r); font-family: var(--serif); font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }
  .foot { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--fg3); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .addr { font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px; color: var(--fg3); word-break: break-all; }
  .skel { height: 14px; border-radius: 4px; background: var(--bg2); margin: 8px 0; }
  .err { color: var(--color-text-danger, #7F2C28); font-size: 13px; }
  .siden { margin: 0 0 10px; padding: 8px 10px; background: var(--bg2); border-radius: var(--r); }
  .siden .lbl { margin: 0 0 4px; color: var(--coral); }
  .siden .sl { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 13px; } .siden .sl a { cursor: pointer; color: var(--fg); }
  .clip { margin: 4px 0 0; font-size: 12px; color: var(--warn-fg); background: var(--warn-bg); padding: 4px 8px; border-radius: var(--r); }
</style>
</head>

<div id="root"><div class="skel" style="width:40%"></div><div class="skel" style="width:90%"></div><div class="skel" style="width:70%"></div></div>
<script type="module">
/*__BUNDLE__*/
</script>
<script>
// Feil i kortet skal synes i kortet, ikke bare i en konsoll ingen ser (Desktop skjuler den).
window.addEventListener('error', (e) => { const p = document.createElement('p'); p.className = 'err'; p.textContent = 'Feil i kortet: ' + (e.message || e.type); document.getElementById('root').append(p) })
window.addEventListener('unhandledrejection', (e) => { const p = document.createElement('p'); p.className = 'err'; p.textContent = 'Feil i kortet: ' + (e.reason?.message || e.reason); document.getElementById('root').append(p) })
</script>
<script type="module">
const { App } = window.McpApps
const app = new App({ name: 'Tua kort', version: '0.1.0' })
const root = document.getElementById('root')
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v)
    else if (v != null) n.setAttribute(k, v)
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(String(k)))
  return n
}
const LV = { S: 'ingress', M: 'sammendrag', L: 'alt' }
// replaceChildren er nativ og gjør null til teksten «null»; put() filtrerer som el() gjør
const put = (...kids) => root.replaceChildren(...kids.flat().filter((k) => k != null))
let state = null        // siste structuredContent fra serveren
let busy = false

// ── størrelse: kortet skal passe innholdet, aldri rulle innvendig
let connected = false
const ro = new ResizeObserver(() => { if (connected) app.sendSizeChanged({ width: document.body.scrollWidth, height: document.body.scrollHeight }).catch(() => {}) })
ro.observe(root)

// ── vertens tema og stil-variabler (lys/mørk) legges på dokumentet
const applyHost = (ctx) => {
  if (!ctx) return
  for (const [k, v] of Object.entries(ctx.styles?.variables || {})) document.documentElement.style.setProperty(k, v)
  if (ctx.theme) document.documentElement.style.colorScheme = ctx.theme
}

// ── liten markdown-gjengivelse for M/L: overskrifter, lister, avsnitt, fet, kode. Tekst, aldri HTML inn.
const inline = (s) => {
  const frag = document.createDocumentFragment()
  const re = /(\*\*[^*]+\*\*|`[^`]+`)/g
  let i = 0, m
  while ((m = re.exec(s))) {
    if (m.index > i) frag.append(s.slice(i, m.index))
    const t = m[0]
    frag.append(t.startsWith('`') ? el('code', {}, t.slice(1, -1)) : el('strong', {}, t.slice(2, -2)))
    i = m.index + t.length
  }
  if (i < s.length) frag.append(s.slice(i))
  return frag
}
const md = (text) => {
  const out = el('div', { class: 'md' })
  let list = null
  for (const raw of String(text || '').split('\n')) {
    const line = raw.trimEnd()
    if (!line.trim()) { list = null; continue }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    const li = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/)
    if (h) { list = null; out.append(el(h[1].length <= 2 ? 'h3' : 'h4', {}, inline(h[2]))) }
    else if (li) { if (!list) { list = el('ul', {}); out.append(list) } list.append(el('li', {}, inline(li[1]))) }
    else { list = null; out.append(el('p', {}, inline(line))) }
  }
  return out
}

// 0.5.18: navigering i kortet. Hvert steg (liste, side i lista, sak, nivå) legges i en logg, så «Tilbake» og «Frem» virker som i en nettleser.
// Et nytt kort fra Claude starter loggen på nytt. `til` = plass i loggen (tilbake/frem); uten `til` er det et nytt steg.
let logg = [], plass = -1
const rens = (o) => Object.fromEntries(Object.entries(o || {}).filter(([, v]) => v !== '' && v !== undefined && v !== null))
const argsAv = (sc) => (sc?.mode === 'atom' ? { id: sc.atom.id, level: sc.atom.level } : sc?.mode === 'list' ? rens({ query: sc.query, project: sc.project, context: sc.context, limit: sc.limit, offset: sc.offset }) : null)
const call = async (args, til) => {
  if (busy) return
  busy = true
  try {
    if (args.alle) { if (til !== undefined) plass = til; else { logg = logg.slice(0, plass + 1); logg.push(args); plass = logg.length - 1 } await visAlle(args); return }
    const r = await app.callServerTool({ name: 'tua_card', arguments: args })
    if (til !== undefined) plass = til
    else { const forrige = logg[plass]; if (forrige?.id && forrige.id === args.id) logg[plass] = args; else { logg = logg.slice(0, plass + 1); logg.push(args); plass = logg.length - 1 } }   // nivåbytte på samme sak er ikke et nytt steg
    render(r)
  }
  catch (e) { root.append(el('p', { class: 'err' }, 'Tua svarte ikke: ' + (e?.message || e))) }
  finally { busy = false }
}
// «Åpne i …»: alt går via serverens tua_open, som åpner lokalt (open / explorer / xdg-open). 0.5.16: vertens openLink brukes ikke
// lenger — Claude Desktop slipper bare https-lenker gjennom («open-link non-https blocked»), så «Kartet» og lenkene inn i Tua-appen
// (http://127.0.0.1) gjorde ingenting, uten feilmelding. Knappen kvitterer selv, og feil fra serveren vises i kortet.
const open = async (target, atom, knapp) => {
  const før = knapp?.textContent
  try {
    if (knapp) knapp.textContent = '…'
    const r = await app.callServerTool({ name: 'tua_open', arguments: { id: atom.id, target } })
    if (r?.isError) { if (knapp) knapp.textContent = før; root.append(el('p', { class: 'err' }, (r.content || []).map((c) => c.text).filter(Boolean).join(' ') || 'Kunne ikke åpne.')); return }
    if (knapp) { knapp.textContent = 'Åpnet ✓'; setTimeout(() => { knapp.textContent = før }, 2000) }
  } catch (e) { if (knapp) knapp.textContent = før; root.append(el('p', { class: 'err' }, 'Kunne ikke åpne: ' + (e?.message || e))) }
}
// en knapp som åpner noe utenfor kortet; finnes ikke målet, vises ikke knappen (før: grå, død knapp)
const åpneKnapp = (tekst, target, atom, { vis = true, primær = false, title = null } = {}) => { if (!vis) return null; const b = el('button', { class: 'btn' + (primær ? ' primary' : ''), type: 'button', title }, tekst); b.addEventListener('click', () => open(target, atom, b)); return b }
const åpneLenke = (tekst, target, atom) => { const l = el('a', { role: 'button', tabindex: '0', style: 'cursor:pointer' }, tekst); l.addEventListener('click', () => open(target, atom, l)); return l }
const tellModel = (text) => { try { app.updateModelContext({ content: [{ type: 'text', text }] }) } catch {} }
// Runde 3a: «Kopier instruksen» — prosjekt-instruksen for Desktop («spør Tua først») når prosjektet har Desktop-uuid; Erik limer den inn én gang.
const kopier = async (tekst, knapp) => {
  try { await navigator.clipboard.writeText(tekst); knapp.textContent = 'Kopiert ✓' } catch { knapp.textContent = 'Kunne ikke kopiere — be Claude gjengi den' }
  setTimeout(() => { knapp.textContent = 'Kopier instruksen' }, 2500)
}
const instruksKnapp = (tekst) => { if (!tekst) return null; const b = el('button', { class: 'btn', type: 'button', title: 'Lim inn i Desktop-prosjektets «Project instructions»' }, 'Kopier instruksen'); b.addEventListener('click', () => kopier(tekst, b)); return b }
// Runde 3a: «Siden sist i Tua» — det som er gjort i appen for prosjektet (Spør-tråder, delinger, filer lest inn), ved første kall i samtalen
const SLAG = { tråd: 'Spør', deling: 'Delt', innlest: 'Lest inn', samtale: 'Samtaler' }
const sidenSistBlokk = (s) => s ? el('div', { class: 'siden' },
  el('div', { class: 'lbl' }, `Siden sist i Tua · ${s.dager} dager${s.prosjekt ? ' · ' + s.prosjekt : ''}`),
  ...(s.linjer.length ? s.linjer.map((l) => el('div', { class: 'sl' }, el('span', { class: 'chip' }, SLAG[l.slag] || l.slag), el('a', { onclick: () => call({ id: l.id, level: 'S' }) }, l.tekst))) : [el('p', { class: 'why' }, 'Ingenting nytt i appen.')]),
  s.lagret ? el('p', { class: 'why' }, `${s.lagret} ${s.lagret === 1 ? 'sak' : 'saker'} lagret med vilje.`) : null,
) : null

// Runde 3b: delingen på en delingssak — mottakerne som personer, lenka til mottakersiden (åpnes i nettleseren), «Kopier lenka», fila, trukket
const kopierLenke = async (tekst, knapp) => { const før = knapp.textContent; try { await navigator.clipboard.writeText(tekst); knapp.textContent = 'Kopiert ✓' } catch { knapp.textContent = 'Kunne ikke kopiere' } setTimeout(() => { knapp.textContent = før }, 2500) }
const delingBlokk = (d, a) => d ? [el('div', { class: 'lbl' }, 'Delt med'), el('div', { class: 'chips' }, ...d.til.map((t) => el('span', { class: 'chip', title: t.epost || '' }, `${t.navn}${t.merke ? ' · ' + t.merke : ''}`)), el('span', { class: 'chip' }, `nivå ${d.nivå}`), d.trukket ? el('span', { class: 'chip warn' }, 'trukket tilbake') : null, d.forespørsler ? el('span', { class: 'chip warn' }, `${d.forespørsler} ba om hele`) : null),
  d.trukket ? el('p', { class: 'why' }, 'Delingen er trukket tilbake — lenka virker ikke lenger.') : el('div', { class: 'row' }, a.app ? åpneKnapp('Mottakersiden', 'deling', a) : null, (() => { const b = el('button', { class: 'btn', type: 'button' }, 'Kopier lenka'); b.addEventListener('click', () => kopierLenke(d.http, b)); return b })(), a.app ? åpneKnapp('Som fil', 'delingsfil', a, { title: 'Siden som én HTML-fil — send den selv når mottakeren ikke er på samme nett' }) : null)] : []

// ── ett atom (V12: S først, M/L på forespørsel, «Åpne i …»)
// 0.5.20: «Vis alle» — hele lista i én visning (tittel, prosjekt, dato), hentet 50 om gangen, med et filterfelt. Kortet ber verten om stor visning
// (sidepanel/fullskjerm) når verten tilbyr det; ellers vises lista i kortet der det står. Lista huskes, så «Tilbake» til den er øyeblikkelig.
const ALLE_MAKS = 500
const alleMinne = new Map()
let stor = false
const tilStor = async (på) => {
  try {
    const ctx = app.getHostContext?.()
    const mål = på ? 'fullscreen' : 'inline'
    if (!ctx?.availableDisplayModes?.includes(mål) || (ctx.displayMode || 'inline') === mål) { stor = på && ctx?.displayMode === 'fullscreen'; return }
    const r = await app.requestDisplayMode({ mode: mål })
    stor = r?.mode === 'fullscreen'
  } catch { stor = false }
}
async function visAlle(args) {
  const nøkkel = JSON.stringify(args)
  let d = alleMinne.get(nøkkel)
  const tegn = () => {
    const filter = el('input', { type: 'search', class: 'filter', placeholder: 'Filtrer på tittel eller prosjekt', 'aria-label': 'Filtrer lista' })
    const liste = el('div', { class: 'alle' })
    const antall = el('span', { class: 'meta', style: 'font-size:12px;color:var(--fg3)' })
    const fyll = () => {
      const f = filter.value.trim().toLowerCase()
      const vis = d.items.filter((a) => !f || (a.name + ' ' + a.project).toLowerCase().includes(f))
      liste.replaceChildren(...vis.map((a) => el('div', { class: 'rad' },
        el('span', { class: 'dato' }, a.date),
        el('a', { class: 'tittel', title: a.S || '', onclick: () => call({ id: a.id, level: 'S' }) }, a.name),
        el('span', { class: 'pro' }, a.project))))
      antall.textContent = `${f ? vis.length + ' av ' : ''}${d.items.length}${d.total > d.items.length ? ' av ' + d.total + (d.ferdig ? ' (de første ' + ALLE_MAKS + ')' : ' — henter …') : ''} ${d.query ? 'treff på «' + d.query + '»' : 'saker'}${d.project ? ' i ' + d.project : ''}`
    }
    filter.oninput = fyll
    put(navBlokk(), el('div', { class: 'eyebrow' }, 'Alle', el('span', { class: 'meta' }, d.project ? `· ${d.project}` : '· alle prosjekter')), el('div', { class: 'row' }, filter, antall), liste,
      el('div', { class: 'foot' }, el('span', {}, 'Trykk på en tittel for å åpne saken. «Tilbake» tar deg hit igjen.'), el('span', {}, 'Tua · skjermet og logget')))
    fyll()
    return fyll
  }
  if (d?.ferdig) { tegn(); return }
  d = { items: [], total: 0, query: args.query || '', project: args.project || '', ferdig: false }
  alleMinne.set(nøkkel, d)
  await tilStor(true)
  let fyll = tegn()
  try {
    for (let o = 0; o < ALLE_MAKS; o += 50) {
      const r = await app.callServerTool({ name: 'tua_card', arguments: rens({ query: args.query, project: args.project, context: args.context, limit: 50, offset: o, quiet: true }) })
      const sc = r?.structuredContent
      if (!sc || sc.mode !== 'list') break
      d.total = sc.total; d.items.push(...sc.items)
      if (logg[plass]?.alle) fyll(); else break                                // brukeren har gått videre — fortsett ikke å tegne over
      if (!sc.items.length || d.items.length >= sc.total) break
    }
    d.ferdig = true
    if (logg[plass]?.alle) fyll()
    tellModel(`Brukeren åpnet «Vis alle» i Tua-kortet: ${d.items.length} ${d.query ? 'treff på «' + d.query + '»' : 'saker'}${d.project ? ' i ' + d.project : ''}.`)
  } catch (e) { alleMinne.delete(nøkkel); root.append(el('p', { class: 'err' }, 'Fikk ikke hentet hele lista: ' + (e?.message || e))) }
}
const navBlokk = () => {
  const litenKnapp = stor ? el('button', { class: 'btn', type: 'button', title: 'Tilbake til kortet i samtalen', onclick: async () => { await tilStor(false); const a = logg[plass]; if (a) call(a, plass) } }, 'Liten visning') : null
  if (logg.length < 2) return litenKnapp ? el('div', { class: 'row nav' }, litenKnapp) : null
  const kn = (tekst, i, title) => el('button', { class: 'btn', type: 'button', title, disabled: i < 0 || i >= logg.length ? 'true' : null, onclick: () => call(logg[i], i) }, tekst)
  return el('div', { class: 'row nav' }, kn('‹ Tilbake', plass - 1, 'Forrige visning i kortet'), kn('Frem ›', plass + 1, 'Neste visning i kortet'), litenKnapp)
}
function renderAtom(a) {
  const seg = el('div', { class: 'seg', role: 'group', 'aria-label': 'Nivå' },
    ...['S', 'M', 'L'].map((L) => el('button', {
      type: 'button', 'aria-pressed': String(a.level === L),
      disabled: (a.max && 'SML'.indexOf(L) > 'SML'.indexOf(a.max)) ? 'true' : null,
      title: a.vault && L !== 'S' ? 'Vault: bare S utleveres' : LV[L],
      onclick: () => { call({ id: a.id, level: L }); tellModel(`Brukeren åpnet ${L} (${LV[L]}) av atom ${a.id} «${a.name}» i Tua-kortet.`) },
    }, L)))
  const chips = (label, items, cls) => items?.length ? [el('div', { class: 'lbl' }, label), el('div', { class: 'chips' }, ...items.map((c) => el('span', { class: 'chip' + (c.warn ? ' warn' : '') + (c.id ? ' link' : ''), onclick: c.id ? () => call({ id: c.id, level: 'S' }) : null, title: c.title || null }, c.text)))] : []
  put(
    navBlokk(),
    el('div', { class: 'eyebrow' }, a.project, el('span', { class: 'meta' }, `· ${a.date} · v${a.version}${a.kind === 'leveranse' ? ' · leveranse' : ''}${a.source ? ' · ' + a.source : ''}`)),
    el('h1', {}, a.name),
    a.level !== 'S' && a.S ? el('p', { class: 's' }, a.S) : null,
    a.why ? el('p', { class: 'why' }, 'Hvorfor: ' + a.why) : null,
    a.clipped ? el('p', { class: 'clip' }, a.clipped) : null,
    a.samtale ? el('p', { class: 'why samtale' }, `${a.samtale.tua ? 'Samtale i Tua' : 'Samtale fra ' + a.samtale.kilde} · ${a.samtale.vendinger} ${a.samtale.vendinger === 1 ? 'vending' : 'vendinger'} · siste ${a.samtale.siste}${a.samtale.modeller?.length ? ' · ' + a.samtale.modeller.join(', ') : ''}${a.samtale.konklusjon ? ' · konklusjon ' + a.samtale.konklusjon : ''} · `, a.app ? åpneLenke('Fortsett i Tua ›', 'kart', a) : 'åpnes i Tua-appen') : null,
    a.utfordret ? el('p', { class: 'why utfordret' }, `${a.utfordret.tekst}${a.utfordret.låst ? ' · låst' : ''}`) : null,   // skive C (arb. 34)   // skive 4 (arb. 33)
    el('div', { class: 'row' }, seg,
      el('span', { class: 'meta', style: 'font-size:12px;color:var(--fg3)' },
        a.level === 'S' ? `ingress · M ${a.hasM ? 'finnes' : 'mangler'} · L ${a.lengthL} tegn` : `${LV[a.level]}${a.stale ? ' · ⚠ fra v' + a.stale : ''}`)),
    el('div', { class: 'body' }, md(a.text)),
    ...chips('Bygget av', a.builtBy?.map((s) => ({ id: s.id, text: `${s.name} (v${s.version}, ${s.level})${s.missing ? ' · slettet' : s.stale ? ' · nå v' + s.now : ''}`, warn: s.stale || s.missing }))),
    ...chips('Synlig for', a.share?.map((s) => ({ text: `${s.project} · ${s.level}` }))),
    ...delingBlokk(a.deling, a),
    ...chips('Relaterte', a.related?.map((r) => ({ id: r.id, text: r.name, title: r.how }))),
    a.tags?.length ? el('div', { class: 'chips' }, ...a.tags.map((t) => el('span', { class: 'chip' }, '#' + t))) : null,
    el('div', { class: 'row' },
      åpneKnapp('Åpne i Claude', 'claude', a, { vis: !!a.claudeProject, primær: true, title: a.claudeProject || null }),
      åpneKnapp('Vis i ' + (a.fm || 'Finder'), 'finder', a, { vis: !!a.file, primær: !a.claudeProject }),
      åpneKnapp('Code', 'code', a, { vis: !!a.repo, title: 'Åpne repoet i Claude Code med dette atomet' }),
      åpneKnapp('Åpne i Tua', 'kart', a, { vis: !!a.app && !!a.address, title: 'Åpne i Tua-appen på denne maskinen' }),
      instruksKnapp(a.instruks),
    ),
    el('div', { class: 'foot' }, el('span', { class: 'addr' }, a.app ? (a.address || a.id) : a.id), el('span', {}, [a.convo ? `Samtale: ${a.convo}` : '', a.shielded ? `${a.shielded} skjermet` : ''].filter(Boolean).join(' · '))),
  )
}

// ── treffliste (forsiden i miniatyr: ingresser, nyeste først)
function renderList(d) {
  const fra = d.offset || 0, per = d.limit || d.items.length || 5
  const side = (o) => call(rens({ query: d.query, project: d.project, context: d.context, limit: per, offset: o }))
  const flere = d.total > fra + d.items.length
  const bla = fra > 0 || flere ? el('div', { class: 'row bla' },
    el('button', { class: 'btn', type: 'button', disabled: fra > 0 ? null : 'true', onclick: () => side(Math.max(0, fra - per)) }, `‹ Forrige ${per}`),
    el('button', { class: 'btn primary', type: 'button', disabled: flere ? null : 'true', onclick: () => side(fra + per) }, `Neste ${Math.min(per, Math.max(0, d.total - fra - d.items.length)) || per} ›`),
    el('button', { class: 'btn', type: 'button', title: 'Hele lista i én visning, med filter', onclick: () => call(rens({ alle: true, query: d.query, project: d.project, context: d.context })) }, `Vis alle (${d.total})`),
    el('span', { class: 'meta', style: 'font-size:12px;color:var(--fg3)' }, `Viser ${d.items.length ? fra + 1 : 0}–${fra + d.items.length} av ${d.total}`)) : null
  put(
    navBlokk(),
    sidenSistBlokk(d.sidenSist),
    el('div', { class: 'eyebrow' }, d.query ? `${d.total} treff på «${d.query}»` : `${d.total} atomer`, el('span', { class: 'meta' }, d.project ? `· ${d.project}` : '· alle prosjekter')),
    ...d.items.map((a) => {
      const box = el('div', { class: 'inline', hidden: 'true' })
      const more = el('button', { class: 'btn', type: 'button', disabled: a.max === 'S' ? 'true' : null, onclick: async () => {
        if (!box.hidden) { box.hidden = true; more.textContent = 'Les M'; return }
        more.textContent = '…'
        try {
          const r = await app.callServerTool({ name: 'tua_card', arguments: { id: a.id, level: 'M', quiet: true } })
          box.replaceChildren(md(r.structuredContent?.atom?.text || r.content?.[0]?.text || ''))
          box.hidden = false; more.textContent = 'Skjul M'
          tellModel(`Brukeren leste M (sammendrag) av atom ${a.id} «${a.name}» i Tua-kortet.`)
        } catch (e) { box.textContent = 'Fikk ikke hentet M: ' + (e?.message || e); box.hidden = false }
      } }, 'Les M')
      return el('div', { class: 'hit' },
        el('div', { class: 'eyebrow' }, a.project, el('span', { class: 'meta' }, `· ${a.date}${a.kind === 'leveranse' ? ' · leveranse' : ''}${a.thread ? ` · tråd fra Spør: ${a.thread.svar} svar${a.thread.konklusjon ? ', konklusjon ' + a.thread.konklusjon : ''}` : ''}`)),
        el('h2', {}, el('a', { onclick: () => call({ id: a.id, level: 'S' }) }, a.name)),
        // skive 4 (arb. 33): en samtale vises som samtale — vendinger, siste, modellene, konklusjon — med «Fortsett i Tua» til Arbeid (#samtale/<id>)
        a.samtale ? el('p', { class: 'why samtale' }, `${a.samtale.tua ? 'Samtale i Tua' : 'Samtale fra ' + a.samtale.kilde} · ${a.samtale.vendinger} ${a.samtale.vendinger === 1 ? 'vending' : 'vendinger'} · siste ${a.samtale.siste}${a.samtale.modeller?.length ? ' · ' + a.samtale.modeller.join(', ') : ''}${a.samtale.konklusjon ? ' · konklusjon ' + a.samtale.konklusjon : ''} · `, d.app ? åpneLenke('Fortsett i Tua ›', 'kart', a) : 'åpnes i Tua-appen') : null,
    a.utfordret ? el('p', { class: 'why utfordret' }, `${a.utfordret.tekst}${a.utfordret.låst ? ' · låst' : ''}`) : null,   // skive C (arb. 34)
        el('p', { class: 's' }, a.S || a.snippet || ''),
        a.snippet && a.S ? el('p', { class: 'why' }, '… ' + a.snippet) : null,
        el('div', { class: 'row' }, more, el('button', { class: 'btn', type: 'button', onclick: () => call({ id: a.id, level: 'S' }) }, 'Åpne kortet')),
        box,
      )
    }),
    d.instruks ? el('div', { class: 'row' }, instruksKnapp(d.instruks), el('span', { class: 'meta', style: 'font-size:12px;color:var(--fg3)' }, `Desktop-prosjektet «${d.instruksProsjekt}»: lim inn i Project instructions`)) : null,
    bla,
    el('div', { class: 'foot' }, el('span', {}, bla ? `Viser ${fra + 1}–${fra + d.items.length} av ${d.total}` : 'Alle treff vist'), el('span', {}, 'Tua · S i søk, M og L på forespørsel · skjermet og logget')),
  )
}

function render(result) {
  const sc = result?.structuredContent
  if (!sc) { root.replaceChildren(el('p', { class: 'err' }, result?.content?.[0]?.text || 'Tomt svar fra Tua.')); return }
  state = sc
  if (sc.mode === 'atom') renderAtom(sc.atom)
  else if (sc.mode === 'list') renderList(sc)
  else root.replaceChildren(el('p', { class: 'err' }, sc.error || 'Ukjent svar.'))
}

app.ontoolresult = (r) => { const a = argsAv(r?.structuredContent); logg = a ? [a] : []; plass = logg.length - 1; render(r) }   // nytt kort fra Claude: loggen starter på nytt
app.ontoolinput = () => {}
app.onhostcontextchanged = applyHost
await app.connect()
connected = true
try { applyHost(app.getHostContext()) } catch {}
</script>
</body>
</html>
